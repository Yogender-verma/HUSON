<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | HUSON</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body class="dashboard-page">

    <div class="dashboard-container">

        <!-- LEFT SIDE -->
        <div class="dashboard-left glass-box">
            <h2>“Monitor donations and track impact across the city.”</h2>
            <p>See total donations, claimed items, and available resources at a glance.</p>
        </div>

        <!-- RIGHT SIDE: Stats Cards -->
        <div class="dashboard-right glass-box">

            <h2><i class="ri-dashboard-3-line"></i> Dashboard</h2>

            <div class="stats-grid">
                <div class="stat-card glass-box">
                    <h3>Total Donations</h3>
                    <p id="totalDonations">0</p>
                </div>
                <div class="stat-card glass-box">
                    <h3>Available Donations</h3>
                    <p id="availableDonations">0</p>
                </div>
                <div class="stat-card glass-box">
                    <h3>Claimed Donations</h3>
                    <p id="claimedDonations">0</p>
                </div>
                <div class="stat-card glass-box">
                    <h3>Latest Donation</h3>
                    <p id="latestDonation">None</p>
                </div>
            </div>

            <!-- Back Button -->
            <button onclick="location.href='index.html'" class="btn-back">
                <i class="ri-arrow-left-line"></i> Back to Home
            </button>

        </div>

    </div>
<button id="darkToggle">
    <i class="ri-moon-line"></i> Dark Mode
</button>

</body>
</html>
