<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Available Donations | HUSON</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <i class="ri-heart-pulse-line"></i> HUSON
        </div>
        <div class="sidebar-subtitle">Impact Dashboard</div>
        
                <ul class="sidebar-nav">
            <li onclick="window.location.href='ngo.html'"><i class="ri-dashboard-line"></i> Dashboard</li>
            <li class="active" onclick="window.location.href='ngo-all-donations.html'"><i class="ri-gift-line"></i> Available Donations</li>
            <li onclick="window.location.href='ngo-pending-requests.html'"><i class="ri-file-list-3-line"></i> My Requests</li>
            <li onclick="window.location.href='ngo-live-tracking.html'"><i class="ri-truck-line"></i> Pickups</li>
            <li onclick="window.location.href='ngo-notifications.html'"><i class="ri-notification-3-line"></i> Notifications</li>
        </ul>

                <ul class="sidebar-bottom">
            <li onclick="window.location.href='ngo-settings.html'"><i class="ri-settings-4-line"></i> Settings</li>
            <li onclick="window.location.href='index.html'"><i class="ri-logout-box-r-line"></i> Logout</li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="main-header">
            <div class="header-text">
                <h1>All Available <span class="highlight-text">Donations</span></h1>
                <p>Browse and request surplus food and items from donors near you.</p>
            </div>
            <div class="header-actions">
                <div class="search-bar">
                    <i class="ri-search-line"></i>
                    <input type="text" id="searchInput" placeholder="Search by item, location...">
                </div>
                <div class="avatar"><img src="https://ui-avatars.com/api/?name=NGO&background=9b51e0&color=fff" alt="Avatar"></div>
            </div>
        </header>

        <!-- Filters (Mock) -->
        <div style="display: flex; gap: 10px; margin-bottom: 30px;" id="filterButtons">
            <button class="btn-secondary filter-btn" data-category="All" style="padding: 10px 20px; font-size: 0.9rem; border-color: var(--accent-color); color: var(--accent-color);">All Categories</button>
            <button class="btn-secondary filter-btn" data-category="Food" style="padding: 10px 20px; font-size: 0.9rem;">Food</button>
            <button class="btn-secondary filter-btn" data-category="Clothes" style="padding: 10px 20px; font-size: 0.9rem;">Clothes</button>
            <button class="btn-secondary filter-btn" data-category="Medicines" style="padding: 10px 20px; font-size: 0.9rem;">Medicines</button>
        </div>

        <!-- Donations Grid -->
        <div class="nearby-grid" id="donationsGrid">
            <!-- 24 Items will be injected here via JavaScript -->
        </div>
    </main>

    <!-- Toast for Notifications -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
    <script>
        // Array of 5 distinct donations
        const mockDonations = [
            { category: "Food", img: "img/apples.png", badge: "1h 30m left", donor: "Sunrise Orchards", desc: "Fresh Red Apples", weight: "20 kg", distance: "1.2 km", location: "18 Valley Road, Suburbs" },
            { category: "Clothes", img: "img/clothes.png", badge: "No expiry", donor: "Community Center", desc: "Assorted Winter Wear", weight: "35 items", distance: "3.0 km", location: "402 Pine Street, West End" },
            { category: "Food", img: "img/water.png", badge: "No expiry", donor: "ClearSprings", desc: "Bottled Drinking Water", weight: "50 cases", distance: "2.5 km", location: "45 Corporate Drive, Downtown" },
            { category: "Food", img: "img/vegetables.png", badge: "5h left", donor: "City Harvest", desc: "Leafy Green Vegetables", weight: "15 kg", distance: "4.5 km", location: "122 Artisan Lane, West End" },
            { category: "Medicines", img: "img/medicines.png", badge: "Exp 2028", donor: "HealthPlus Pharma", desc: "First Aid & OTC Medicines", weight: "10 boxes", distance: "1.8 km", location: "88 Sunset Blvd, North Hills" }
        ];

        const grid = document.getElementById("donationsGrid");
        const localSearchInput = document.getElementById("searchInput");
        const filterBtns = document.querySelectorAll(".filter-btn");

        let currentCategory = "All";
        let searchQuery = "";

        function renderDonations(donations) {
            grid.innerHTML = ""; // Clear existing
            
            if (donations.length === 0) {
                grid.innerHTML = "<p style='color: var(--secondary-text); grid-column: 1 / -1;'>No donations found matching your criteria.</p>";
                return;
            }

            donations.forEach(item => {
                const cardHTML = `
                    <div class="img-card glass-box">
                        <div class="img-wrap">
                            <img src="${item.img}" alt="${item.desc}">
                            <span class="img-badge"><i class="ri-timer-line"></i> ${item.badge}</span>
                        </div>
                        <div class="img-content">
                            <div class="img-row">
                                <div>
                                    <h4>${item.donor}</h4>
                                    <p>${item.desc}</p>
                                </div>
                                <div class="text-right">
                                    <h4 class="primary-text">${item.weight}</h4>
                                    <p>${item.distance}</p>
                                </div>
                            </div>
                            <div class="img-location"><i class="ri-map-pin-line"></i> ${item.location}</div>
                            <div class="img-actions">
                                <button class="btn-primary w-full" onclick="toggleRequest(this)">Request Pickup</button>
                                <button class="btn-secondary btn-icon"><i class="ri-information-line"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        function toggleRequest(btn) {
            if (btn.innerText === 'Request Pickup') {
                btn.innerText = 'Cancel Pickup';
                btn.style.backgroundColor = '#e74c3c';
                btn.style.borderColor = '#e74c3c';
                btn.style.color = 'white';
                showToast('Request submitted!');
            } else {
                btn.innerText = 'Request Pickup';
                btn.style.backgroundColor = '';
                btn.style.borderColor = '';
                btn.style.color = '';
                showToast('Pickup cancelled!', '#e74c3c');
            }
        }

        function filterData() {
            const lowerQuery = searchQuery.toLowerCase();
            const filtered = mockDonations.filter(item => {
                const matchCategory = currentCategory === "All" || item.category === currentCategory;
                const matchSearch = item.desc.toLowerCase().includes(lowerQuery) || 
                                    item.donor.toLowerCase().includes(lowerQuery) || 
                                    item.location.toLowerCase().includes(lowerQuery);
                return matchCategory && matchSearch;
            });
            renderDonations(filtered);
        }

        // Event listener for search
        localSearchInput.addEventListener("input", (e) => {
            searchQuery = e.target.value;
            filterData();
        });

        // Event listener for category filters
        filterBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                // Update active styling
                filterBtns.forEach(b => {
                    b.style.borderColor = "";
                    b.style.color = "";
                });
                btn.style.borderColor = "var(--accent-color)";
                btn.style.color = "var(--accent-color)";

                currentCategory = btn.getAttribute("data-category");
                filterData();
            });
        });

        // Initial render
        renderDonations(mockDonations);
    </script>
</body>
</html>
